<template>
  <template if:true={showAttachmentSelector}>
    <c-docgen-additional-pdf-selector
      record-id={recordId}
      template-id={templateId}
      template-name={templateName}
      output-format={outputFormat}
      onselectionchange={handleAttachmentSelection}>
    </c-docgen-additional-pdf-selector>
  </template>
  <lightning-button
    label={buttonLabel}
    onclick={handleGenerateClick}
    disabled={isProcessing}
    variant="brand"
    class="slds-m-around_medium"
  ></lightning-button>

  <template if:true={isProcessing}>
    <lightning-spinner
      alternative-text="Generating document..."
      size="small"
    ></lightning-spinner>
  </template>
</template>
