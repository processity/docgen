<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Use the exact Microsoft font when supplied; otherwise use a Japanese
       family that includes regular and bold faces instead of DroidSansFallback. -->
  <alias>
    <family>Meiryo UI</family>
    <accept>
      <family>Noto Sans CJK JP</family>
    </accept>
  </alias>
  <alias>
    <family>Meiryo</family>
    <accept>
      <family>Noto Sans CJK JP</family>
    </accept>
  </alias>
</fontconfig>
